name: Build News Reel

# Two ways to build (testing phase — automation comes after final approval):
# 1. WEBSITE (no token setup): select stories on the site -> "Build reel" opens
#    a prefilled GitHub issue -> submit it -> this workflow runs.
# 2. MANUAL: Actions tab -> "Run workflow", or repository_dispatch with build_key.
on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [build-reel]
  workflow_dispatch:

permissions:
  contents: write   # for creating the release
  issues: write     # for commenting/closing the build issue

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Verify build key
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ -z "${{ secrets.BUILD_KEY }}" ]; then
            echo "BUILD_KEY secret is not set — refusing to build."
            exit 1
          fi
          if [ "${{ github.event.client_payload.build_key }}" != "${{ secrets.BUILD_KEY }}" ]; then
            echo "Invalid build key — refusing to build."
            exit 1
          fi

      - name: Resolve issue build request
        if: github.event_name == 'issues'
        run: |
          if [[ "${{ github.event.issue.title }}" != "[reel-build]"* ]]; then
            echo "Not a reel build issue — skipping."
            exit 1
          fi
          if [ "${{ github.event.issue.user.login }}" != "irajmalik425707-max" ]; then
            echo "Only the repo owner can trigger builds."
            exit 1
          fi
          IDS=$(echo "${{ github.event.issue.body }}" | grep -oP 'stories:\s*\K[0-9, ]+' | tr ',' ' ' || true)
          echo "Issue requested story IDs: [$IDS]"
          echo "IDS=$IDS" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install yt-dlp edge-tts gTTS faster-whisper
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto
          # install bundled reel font for captions
          mkdir -p ~/.local/share/fonts
          cp pipeline/fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
          fc-cache -f ~/.local/share/fonts >/dev/null 2>&1 || true
          fc-list | grep -i anton || echo "anton not in fc-list"
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Get stories
        # Website/issue builds reuse the exact list the user saw (so clicked IDs match);
        # manual runs fetch fresh trending news.
        run: |
          mkdir -p work
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 pipeline/fetch_news.py 10 work/stories.json
          else
            python3 -c "import json; d=json.load(open('web/stories.json')); json.dump(d['stories'], open('work/stories.json','w'), indent=1)"
          fi
          python3 -c "import json; print(len(json.load(open('work/stories.json'))), 'stories')"

      - name: Choose stories
        env:
          STORY_IDS: ${{ toJson(github.event.client_payload.story_ids) }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            SEL="${IDS:-}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SEL=$(python3 -c "import json,os; print(' '.join(map(str, json.loads(os.environ.get('STORY_IDS') or '[]'))))")
          else
            SEL=""
          fi
          if [ -z "$SEL" ]; then SEL="auto"; fi
          python3 pipeline/choose.py work/stories.json work/chosen.json $SEL

      - name: Write voiceover script
        run: python3 pipeline/write_script.py work/chosen.json work/segments.json

      - name: Fetch images
        run: python3 pipeline/fetch_images.py work/chosen.json work/

      - name: Fetch video clips
        run: python3 pipeline/fetch_clips.py work/

      - name: Fetch thumbnails (image fallback)
        run: python3 pipeline/fetch_thumbs.py work/

      - name: Generate AI visuals
        run: python3 pipeline/fetch_ai.py work/

      - name: Synthesize voiceover
        run: python3 pipeline/make_audio.py work/segments.json work/

      - name: Make captions
        run: python3 pipeline/make_captions.py work/ white

      - name: Compose reel
        run: |
          TAG="reel-$(date +%Y%m%d-%H%M%S)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          python3 pipeline/compose.py work/ "work/${TAG}.mp4"

      - name: Publish release with video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls work/reel-*.mp4 | head -1)
          TITLE=$(python3 -c "
          import json
          segs = json.load(open('work/segments.json'))
          print(' + '.join(s['headline'][:45] for s in segs[:3]))")
          gh release create "$TAG" "$FILE" \
            --title "News Reel $TAG" \
            --notes "$TITLE"
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/$TAG" >> $GITHUB_ENV

      - name: Reply to build issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=${{ github.event.issue.number }}
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment $NUM --body "✅ Reel ready! Watch it under 'Your reels': https://irajmalik425707-max.github.io/news-reel-studio/ (${RELEASE_URL:-see Releases})"
          else
            gh issue comment $NUM --body "❌ Build failed — check the Actions log for details."
          fi
          gh issue close $NUM
