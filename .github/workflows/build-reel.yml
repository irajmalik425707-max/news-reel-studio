name: Build News Reel

# Two ways to build:
# 1. AUTO (no setup needed): runs on schedule, builds from top trending stories.
# 2. MANUAL: triggered from the website ("Build Reel" button) via repository_dispatch.
#    Payload: { "story_ids": [1,3,5], "build_key": "<secret key>" }
on:
  repository_dispatch:
    types: [build-reel]
  schedule:
    - cron: "0 4,16 * * *"   # twice daily auto reel (04:00 + 16:00 UTC)
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: write   # for creating the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Verify build key
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ -z "${{ secrets.BUILD_KEY }}" ]; then
            echo "BUILD_KEY secret is not set — refusing to build."
            exit 1
          fi
          if [ "${{ github.event.client_payload.build_key }}" != "${{ secrets.BUILD_KEY }}" ]; then
            echo "Invalid build key — refusing to build."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install yt-dlp edge-tts gTTS faster-whisper
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto > /dev/null 2>&1 || true
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Get stories
        # Website builds reuse the exact list the user saw (so clicked IDs match);
        # scheduled builds fetch fresh trending news.
        run: |
          mkdir -p work
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            python3 -c "import json; d=json.load(open('web/stories.json')); json.dump(d['stories'], open('work/stories.json','w'), indent=1)"
          else
            python3 pipeline/fetch_news.py 10 work/stories.json
          fi
          python3 -c "import json; print(len(json.load(open('work/stories.json'))), 'stories')"

      - name: Choose stories
        env:
          STORY_IDS: ${{ toJson(github.event.client_payload.story_ids) }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            IDS=$(python3 -c "import json,os; print(' '.join(map(str, json.loads(os.environ.get('STORY_IDS') or '[]'))))")
          else
            IDS=""
          fi
          if [ -z "$IDS" ]; then IDS="auto"; fi
          python3 pipeline/choose.py work/stories.json work/chosen.json $IDS

      - name: Write voiceover script
        run: python3 pipeline/write_script.py work/chosen.json work/segments.json

      - name: Fetch images
        run: python3 pipeline/fetch_images.py work/chosen.json work/

      - name: Fetch video clips
        run: python3 pipeline/fetch_clips.py work/

      - name: Synthesize voiceover
        run: python3 pipeline/make_audio.py work/segments.json work/

      - name: Make captions
        run: python3 pipeline/make_captions.py work/ white

      - name: Compose reel
        run: |
          TAG="reel-$(date +%Y%m%d-%H%M%S)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          python3 pipeline/compose.py work/ "work/${TAG}.mp4"

      - name: Publish release with video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls work/reel-*.mp4 | head -1)
          TITLE=$(python3 -c "
          import json
          segs = json.load(open('work/segments.json'))
          print(' + '.join(s['headline'][:45] for s in segs[:3]))")
          gh release create "$TAG" "$FILE" \
            --title "News Reel $TAG" \
            --notes "$TITLE"
